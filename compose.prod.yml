services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: ${MIRROR_POSTGRES_PASSWORD:-mirror}
    volumes:
      - mirror_postgres:/var/lib/postgresql/data
    networks:
      - mirror
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - mirror

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MIRROR_MINIO_ROOT_USER:-mirror}
      MINIO_ROOT_PASSWORD: ${MIRROR_MINIO_ROOT_PASSWORD:-mirror-local-only}
    volumes:
      - mirror_minio:/data
    networks:
      - mirror

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      MIRROR_DATABASE_URL: postgresql+pg8000://mirror:${MIRROR_POSTGRES_PASSWORD:-mirror}@postgres:5432/mirror
      MIRROR_COURSEPACK_ROOT: /app/coursepacks
      MIRROR_LLM_PROVIDER: ${MIRROR_LLM_PROVIDER:-stub}
      MIRROR_LLM_BASE_URL: ${MIRROR_LLM_BASE_URL:-}
      MIRROR_LLM_API_KEY: ${MIRROR_LLM_API_KEY:-}
      MIRROR_LLM_MODEL: ${MIRROR_LLM_MODEL:-}
      MIRROR_LLM_TIMEOUT: ${MIRROR_LLM_TIMEOUT:-120}
      # 生产由 nginx 同域代理，CORS 来源置空
      MIRROR_CORS_ORIGINS: ""
    volumes:
      - ./coursepacks:/app/coursepacks:ro
      - ./materials:/app/materials:ro
    networks:
      - mirror
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mirror
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mirror_postgres:
  mirror_minio:

networks:
  mirror:
