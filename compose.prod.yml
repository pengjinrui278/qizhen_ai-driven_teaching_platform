services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: ${MIRROR_POSTGRES_PASSWORD:-mirror}
    volumes:
      - mirror_postgres:/var/lib/postgresql/data
    networks:
      - mirror
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - mirror
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MIRROR_MINIO_ROOT_USER:-mirror}
      MINIO_ROOT_PASSWORD: ${MIRROR_MINIO_ROOT_PASSWORD:-mirror-local-only}
    volumes:
      - mirror_minio:/data
    networks:
      - mirror
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      MIRROR_DATABASE_URL: postgresql+pg8000://mirror:${MIRROR_POSTGRES_PASSWORD:-mirror}@postgres:5432/mirror
      MIRROR_COURSEPACK_ROOT: /app/coursepacks
      MIRROR_LLM_PROVIDER: ${MIRROR_LLM_PROVIDER:-stub}
      MIRROR_LLM_BASE_URL: ${MIRROR_LLM_BASE_URL:-}
      MIRROR_LLM_API_KEY: ${MIRROR_LLM_API_KEY:-}
      MIRROR_LLM_MODEL: ${MIRROR_LLM_MODEL:-deepseek-flash}
      MIRROR_VISION_MODEL: ${MIRROR_VISION_MODEL:-deepseek-flash}
      MIRROR_LLM_TIMEOUT: ${MIRROR_LLM_TIMEOUT:-120}
      MIRROR_ENVIRONMENT: production
      MIRROR_SECURE_COOKIE: "true"
      MIRROR_STAFF_INVITE_CODE: ${MIRROR_STAFF_INVITE_CODE:?Set a private team invite code before deployment}
      MIRROR_SESSION_HOURS: ${MIRROR_SESSION_HOURS:-24}
      MIRROR_CLEANUP_INTERVAL_SECONDS: ${MIRROR_CLEANUP_INTERVAL_SECONDS:-60}
      # 写请求会校验浏览器 Origin；显式允许正式域名及 www 域名。
      MIRROR_CORS_ORIGINS: "https://learningmirror.cn,https://www.learningmirror.cn"
    volumes:
      - ./coursepacks:/app/coursepacks:ro
      - ./materials:/app/materials:ro
    networks:
      - mirror
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_ICP_NUMBER: ${MIRROR_ICP_NUMBER:-}
        NEXT_PUBLIC_PUBLIC_SECURITY_NUMBER: ${MIRROR_PUBLIC_SECURITY_NUMBER:-}
        NEXT_PUBLIC_PUBLIC_SECURITY_URL: ${MIRROR_PUBLIC_SECURITY_URL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - mirror_caddy_data:/data
      - mirror_caddy_config:/config
    networks:
      - mirror
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mirror_postgres:
  mirror_minio:
  mirror_caddy_data:
  mirror_caddy_config:

networks:
  mirror:
