<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学分析知识地图 · 学镜</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#1c3048;font:16px/1.6 'Microsoft YaHei',sans-serif}main{max-width:1280px;margin:auto;padding:36px 28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:30px;margin:4px 0}h2{font-size:21px}p{margin:6px 0 20px;color:#52667d}nav{display:flex;gap:10px;margin:24px 0}button,input{font:inherit}button{cursor:pointer;border:1px solid #c9d8ea;background:white;border-radius:8px;padding:10px 18px;color:#244c77}button[aria-selected=true]{background:#245d9c;color:#fff;border-color:#245d9c}input{width:100%;max-width:420px;padding:12px;border:1px solid #c9d8ea;border-radius:8px;background:white}article{background:white;border:1px solid #dbe5ef;border-radius:12px;padding:22px}.chapters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:20px 0 36px}.chapter h3{font-size:18px;margin:0 0 16px;color:#235b96}.chapter ol{list-style:none;border-left:2px solid #d7e6f4;padding:0 0 0 15px;margin:0}.chapter li{margin:0 0 13px;position:relative}.chapter li:before{content:'';position:absolute;left:-20px;top:10px;width:8px;height:8px;border:2px solid #739cc6;background:white;border-radius:50%}.page{display:block;color:#597186;font-size:14px}.subgraph{overflow-x:auto;border:1px solid #dbe5ef;border-radius:12px;background:white}svg{display:block;min-width:940px;width:100%;height:auto}.node{cursor:pointer}.node rect{fill:#edf4fc;stroke:#86abd0;stroke-width:1.5}.node:hover rect,.node:focus rect{fill:#deecfb;stroke:#215f9d;stroke-width:2.5}.node foreignObject div{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:#23496c;font:16px/1.5 'Microsoft YaHei',sans-serif}.detail{margin-top:20px;min-height:130px}.legend{margin-top:14px}.hidden{display:none}footer{margin-top:32px;color:#596d84} @media(max-width:950px){.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:22px 16px}header{display:block}h1{font-size:25px}.chapters{grid-template-columns:1fr}nav button{padding:10px 12px}article{padding:18px}}
.mobileConcepts{display:none}.mobileConcepts button{text-align:left;width:100%;min-height:58px}.mobileConcepts p{font-size:14px;margin:8px 0 0}@media(max-width:560px){.subgraph{display:none}.mobileConcepts{display:grid;gap:12px}}
</style></head><body><main><header><div><div>学镜 · 课程学习</div><h1>数学分析知识地图</h1><p>陈纪修《数学分析》第三版 · 上下册</p></div><input id="search" type="search" aria-label="查找章节或知识点" placeholder="查找章节或知识点"></header>
<nav role="tablist" aria-label="地图视图"><button id="overview-tab" role="tab" aria-selected="true" aria-controls="overview">章节总览</button><button id="concepts-tab" role="tab" aria-selected="false" aria-controls="concepts">数列知识联系</button></nav>
<section id="overview" role="tabpanel" aria-labelledby="overview-tab"><p>按教材目录展开；页码为原书页码。章节相邻不表示存在定理依赖。</p><div id="books"></div></section>
<section id="concepts" class="hidden" role="tabpanel" aria-labelledby="concepts-tab"><p>数列极限 · 从前置概念理解后续知识。点选节点查看来源。</p><div class="subgraph"><svg id="graph" viewBox="0 0 1080 610" role="group" aria-label="数列知识联系图"></svg></div><div class="mobileConcepts" id="mobile-concepts"></div><article class="detail" id="detail" aria-live="polite"></article><p class="legend">此子图包含已核对的7个知识节点，不代表全书覆盖，尚未经教师审定。</p></section><footer>目录来源与知识节点保留各自出处；不展示个人学习数据。</footer></main>
<script>
const data=__DATA__;const $=s=>document.querySelector(s);let active='overview';
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function renderBooks(query=''){$('#books').replaceChildren();let total=0;for(const book of data.books){const wrap=el('div');const grid=el('div',undefined,'chapters');for(const c of book.chapters){const all=(c.number+' '+c.title).includes(query);const sections=c.sections.filter(s=>all||s.title.includes(query));if(!sections.length)continue;total++;const a=el('article',undefined,'chapter');a.append(el('h3','第'+c.number+'章 '+c.title));const list=el('ol');for(const s of sections){const li=el('li');li.append(el('span','§'+s.number+' '+s.title),el('span','第'+s.printed_page+'页 · PDF第'+s.pdf_page+'页','page'));list.append(li);}a.append(list);grid.append(a);}if(grid.children.length){wrap.append(el('h2',book.volume),grid);$('#books').append(wrap);}}if(!total)$('#books').append(el('p','未找到匹配的章节。'));}
function details(n){const a=$('#detail');a.replaceChildren(el('h2',n.title),el('p',n.source.locator));if(n.conditions.length)a.append(el('div','适用条件：'+n.conditions.join('；')));}
function renderGraph(query=''){const svg=$('#graph');svg.replaceChildren();const ns='http://www.w3.org/2000/svg';const make=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;};const positions={};data.nodes.forEach((n,i)=>positions[n.id]=i===0?[30,264]:i===1?[365,264]:[735,25+(i-2)*115]);const defs=make('defs',{});const marker=make('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.append(make('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#92b0cc'}));defs.append(marker);svg.append(defs);for(const e of data.edges){const [x,y]=positions[e.from],[xx,yy]=positions[e.to];svg.append(make('path',{d:`M${x+245} ${y+36} C${x+285} ${y+36},${xx-40} ${yy+36},${xx} ${yy+36}`,fill:'none',stroke:'#b4cbe0','stroke-width':2,'marker-end':'url(#arrow)'}));}for(const n of data.nodes){const [x,y]=positions[n.id];const g=make('g',{class:'node',tabindex:0,role:'button','aria-label':n.title,opacity:!query||n.title.includes(query)?1:.35});g.append(make('rect',{x,y,width:245,height:72,rx:10}));const f=make('foreignObject',{x,y,width:245,height:72});const t=document.createElementNS('http://www.w3.org/1999/xhtml','div');t.textContent=n.title;f.append(t);g.append(f);g.addEventListener('click',()=>details(n));g.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();details(n);}});svg.append(g);}}
function tab(name){active=name;for(const n of ['overview','concepts']){$('#'+n).classList.toggle('hidden',n!==name);$('#'+n+'-tab').setAttribute('aria-selected',String(n===name));}refresh();}
function refresh(){const query=$('#search').value.trim();renderBooks(query);renderGraph(query);const mobile=$('#mobile-concepts');mobile.replaceChildren();for(const n of data.nodes.filter(n=>!query||n.title.includes(query))){const item=el('article');const b=el('button',n.title);b.onclick=()=>{details(n);$('#detail').scrollIntoView({block:'nearest'});};item.append(b);const prerequisites=data.edges.filter(e=>e.to===n.id).map(e=>data.nodes.find(k=>k.id===e.from).title);if(prerequisites.length)item.append(el('p','前置：'+prerequisites.join('、')));mobile.append(item);}}
$('#overview-tab').onclick=()=>tab('overview');$('#concepts-tab').onclick=()=>tab('concepts');$('#search').oninput=refresh;details(data.nodes[1]);refresh();
</script></body></html>
