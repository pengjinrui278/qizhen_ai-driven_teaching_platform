services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
    ports:
      - "5432:5432"
    volumes:
      - mirror_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mirror
      MINIO_ROOT_PASSWORD: mirror-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mirror_minio:/data

volumes:
  mirror_postgres:
  mirror_minio:

