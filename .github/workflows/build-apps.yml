name: Build native apps

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mirror/desktop exec electron-builder --win nsis portable --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: LearningMirror-Windows-${{ matrix.arch }}
          path: apps/desktop/release/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mirror/android sync
      - run: chmod +x apps/android/android/gradlew && cd apps/android/android && ./gradlew assembleDebug
      - run: mkdir -p apps/android/release && cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk apps/android/release/LearningMirror-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LearningMirror-Android
          path: apps/android/release/LearningMirror-Android.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/release/LearningMirror-Android.apk
