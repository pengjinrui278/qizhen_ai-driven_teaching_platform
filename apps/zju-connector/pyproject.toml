[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-mirror-zju-connector"
version = "0.1.0"
description = "Learning Mirror local-only ZJU timetable and deadline connector"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
learning-mirror-zju = "learning_mirror_zju_connector.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_mirror_zju_connector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

