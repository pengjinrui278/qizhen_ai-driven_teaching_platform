<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学镜·导入浙大课表</title>
  <style>
    :root { color-scheme:light; --ink:#15203a; --muted:#69748b; --line:#d8e1f1; --blue:#315ee7; --green:#147a56; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--ink); background:radial-gradient(circle at 50% 0,#eaf0ff 0,transparent 42%),#f7f9fd; }
    main { width:min(480px,calc(100% - 32px)); }
    .brand { margin-bottom:18px; text-align:center; }
    .brand span { color:var(--blue); font-size:13px; font-weight:800; letter-spacing:.08em; }
    h1 { margin:5px 0 8px; font-size:28px; letter-spacing:-.04em; }
    .brand p { margin:0; color:var(--muted); }
    form { padding:28px; border:1px solid rgba(49,94,231,.13); border-radius:20px; background:#fff; box-shadow:0 22px 60px rgba(37,65,126,.12); }
    label { display:block; margin:0 0 7px; font-weight:750; }
    label+input { margin-bottom:18px; }
    input,button { width:100%; height:48px; border-radius:11px; font:inherit; }
    input { border:1px solid var(--line); padding:0 13px; color:var(--ink); outline:none; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(49,94,231,.12); }
    button { margin-top:6px; border:0; background:var(--blue); color:#fff; font-weight:800; cursor:pointer; box-shadow:0 10px 22px rgba(49,94,231,.2); }
    button:disabled { opacity:.62; cursor:wait; }
    .status { min-height:25px; margin:14px 0 0; color:var(--muted); text-align:center; }
    .status.success { color:var(--green); font-weight:750; }
    .status.error { color:#b42318; }
    .privacy { margin:16px 8px 0; color:var(--muted); font-size:13px; text-align:center; }
    .privacy strong { color:var(--green); }
  </style>
</head>
<body>
<main>
  <header class="brand">
    <span>学镜学习空间</span>
    <h1>导入浙大课表</h1>
    <p>登录成功后，当前学期课表将自动返回学镜。</p>
  </header>
  <form id="importForm">
    <label for="username">学号</label>
    <input id="username" inputmode="numeric" autocomplete="username" required autofocus />
    <label for="password">统一认证密码</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button id="importSchedule" type="submit">导入课表</button>
    <p id="status" class="status" role="status"></p>
  </form>
  <p class="privacy"><strong>本机处理</strong>·学号、密码和 Cookie 不会发送到学镜服务器。</p>
</main>
<script>
  const $=(id)=>document.getElementById(id);
  const headers={"Content-Type":"application/json","X-Learning-Mirror-Local":"1"};
  const allowedReturnOrigins=new Set(["https://learningmirror.cn","https://www.learningmirror.cn","http://localhost:3000","http://127.0.0.1:3000"]);
  const requestedReturnOrigin=new URLSearchParams(location.search).get("return_origin");
  const returnOrigin=requestedReturnOrigin&&allowedReturnOrigins.has(requestedReturnOrigin)?requestedReturnOrigin:null;
  function currentTerm(){
    const now=new Date(),month=now.getMonth()+1;
    const academic_year_start=month>=9?now.getFullYear():now.getFullYear()-1;
    if(month>=9&&month<=10)return {academic_year_start,season:"1|秋"};
    if(month>=11||month===1)return {academic_year_start,season:"1|冬"};
    if(month>=2&&month<=4)return {academic_year_start,season:"2|春"};
    return {academic_year_start,season:"2|夏"};
  }
  async function request(path,body){
    const response=await fetch(path,{method:"POST",headers,body:body?JSON.stringify(body):undefined});
    const data=await response.json();
    if(!response.ok)throw new Error(data.detail?.message||data.detail||"操作失败");
    return data;
  }
  $("importForm").onsubmit=async(event)=>{
    event.preventDefault();
    const button=$("importSchedule"),status=$("status"),password=$("password");
    button.disabled=true;button.textContent="正在获取课表…";status.className="status";status.textContent="正在本机完成认证，请稍候。";
    try{
      await request("/api/connect",{username:$("username").value,password:password.value});
      password.value="";
      const snapshot=await request("/api/sync",currentTerm());
      if(!returnOrigin||!window.opener)throw new Error("请从学镜课表页点击“导入课表”后重试。");
      window.opener.postMessage({type:"learning-mirror-zju-snapshot",payload:snapshot},returnOrigin);
      status.className="status success";status.textContent=`已导入 ${snapshot.courses.length} 条课表，即将返回学镜。`;
      button.textContent="导入成功";
      await request("/api/logout");
      setTimeout(()=>window.close(),900);
    }catch(error){
      password.value="";status.className="status error";status.textContent=error.message;
      button.disabled=false;button.textContent="导入课表";
    }
  };
</script>
</body>
</html>
