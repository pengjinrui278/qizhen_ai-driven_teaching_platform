[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-mirror-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  # 不用 uvicorn[standard]：其 httptools 在 Windows ARM64 无预编译轮子，
  # 需要本机 C++ 编译器；standard 中的 uvloop 在 Windows 上本就不可用。
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mirror_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

