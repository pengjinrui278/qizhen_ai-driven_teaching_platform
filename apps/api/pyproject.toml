[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-mirror-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  # 不用 uvicorn[standard]：其 httptools 在 Windows ARM64 无预编译轮子，
  # 需要本机 C++ 编译器；standard 中的 uvloop 在 Windows 上本就不可用。
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  # 驱动选 pg8000（纯 Python）：psycopg[binary] 无 Windows ARM64 轮子，
  # 纯 Python psycopg 依赖本机 libpq 动态库，两者在 ARM64 Windows 都不可用。
  "pg8000>=1.31,<2",
  # 笔记附件上传（FastAPI 的 multipart 表单支持）
  "python-multipart>=0.0.9,<1",
  # 模型网关（OpenAI 兼容接口）的运行时依赖
  "httpx>=0.27,<1",
  # PDF 文本抽取（教材语料入库）
  "pypdf>=5,<7",
  # 笔记导出（python-docx / python-pptx 都是 py3-none-any 纯 Python 轮子；
  # 它们的依赖 lxml 与 Pillow 均提供 win_arm64 轮子，不违反上面的 ARM64 约束）
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mirror_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# FastAPI 习惯用法：Depends() 出现在参数默认值中
"src/mirror_api/main.py" = ["B008"]

